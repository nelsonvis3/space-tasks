<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0f15" />
    <meta name="description" content="SPACE Tasks — a focused space for your day." />
    <link rel="icon" href="/space-mark.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/dm-sans-v17-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>try{const a=JSON.parse(localStorage.getItem('space:appearance:v1')||'null');if(a&&/^#[0-9a-f]{6}$/i.test(a.background)){document.documentElement.style.setProperty('--boot-bg',a.background);document.documentElement.style.colorScheme=a.theme==='light'?'light':'dark'}}catch{}</script>
    <title>SPACE Tasks | Make space for focus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
